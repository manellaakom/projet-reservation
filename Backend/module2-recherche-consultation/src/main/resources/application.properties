spring.application.name=recherche-consultation
server.port=8082

# ============================================================================
# Configuration Base de données MySQL (XAMPP / phpMyAdmin sur localhost:3306)
# ============================================================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/recherche_consultation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI (http://localhost:8082/swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Eureka Discovery Registry (compatible avec Backend/discovery sur :8761)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.home-page-url-path=/swagger-ui/index.html
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# URLs des microservices collègues (Module 1 Bagages :8081 & Module 3 Réservation :8003 & Module 4 :8084)
services.bagages.url=http://localhost:8081
services.reservation.url=http://localhost:8003
services.paiement.url=http://localhost:8084

# ============================================================================
# RabbitMQ Configuration (Broker de messages asynchrone - Note 4 de la grille)
# ============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=true

# Actuator Endpoints (Monitoring & Health)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

