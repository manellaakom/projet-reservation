version: '3.8'

services:
  mysql-module2:
    image: mysql:8.0
    container_name: module2-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=recherche_consultation_db
    volumes:
      - mysql_module2_data:/var/lib/mysql
    networks:
      - travel-network

  rabbitmq-module2:
    image: rabbitmq:3-management-alpine
    container_name: module2-rabbitmq
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - travel-network

  keycloak-module2:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: module2-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - travel-network

  module2-recherche:
    image: module2-recherche:latest
    container_name: module2-recherche-consultation
    restart: unless-stopped
    ports:
      - "9082:8082"
    depends_on:
      - mysql-module2
      - rabbitmq-module2
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-module2:3306/recherche_consultation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_RABBITMQ_HOST=rabbitmq-module2
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak-module2:8080
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  mysql_module2_data:
