server.port=8888
spring.application.name=config-server

# Activation du profil natif (chargement depuis le classpath ou système de fichiers)
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/configurations

# Intégration Eureka pour l'enregistrement et découverte automatique
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,env
