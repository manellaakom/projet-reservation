spring.application.name=reservation-paiement
server.port=8084

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Actuator Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=reservation-paiement
info.app.description=Microservice Module 4 Paiement & Paymee
info.app.version=1.0.0

# Paymee hosted checkout. Mode simulation activé par défaut si aucune clé marchande n'est fournie.
paymee.mock=${PAYMEE_MOCK:true}
paymee.base-url=${PAYMEE_BASE_URL:http://localhost:8084/mock/paymee}
paymee.api-key=${PAYMEE_API_KEY:mock-key-paymee-sandbox}
paymee.frontend-base-url=${PAYMEE_FRONTEND_BASE_URL:http://localhost:4200}
paymee.webhook-url=${PAYMEE_WEBHOOK_URL:http://localhost:8084/api/paiements/paymee/webhook}