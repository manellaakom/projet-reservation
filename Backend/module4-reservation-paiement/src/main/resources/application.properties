spring.application.name=reservation-paiement
server.port=8084

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Paymee hosted checkout. Keep merchant secrets in environment variables only.
paymee.base-url=${PAYMEE_BASE_URL:https://sandbox.paymee.tn}
paymee.api-key=${PAYMEE_API_KEY:}
paymee.frontend-base-url=${PAYMEE_FRONTEND_BASE_URL:}
paymee.webhook-url=${PAYMEE_WEBHOOK_URL:}