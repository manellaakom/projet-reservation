spring.application.name=gateway
server.port=8080

# Spring Cloud Config Server Integration
spring.config.import=optional:configserver:http://localhost:8888

# Eureka integration for service discovery (used by lb:// service names)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Explicit gateway route config; discovery locator is kept off to avoid surprises
spring.cloud.gateway.discovery.locator.enabled=false

# Swagger UI aggregateur sur la Gateway
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Gestion des Bagages
springdoc.swagger-ui.urls[0].url=/v3/api-docs/bagages

# Actuator & Prometheus Endpoints
management.endpoints.web.exposure.include=health,info,gateway,prometheus,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Actuator Info metadata
info.app.name=API Gateway - SkyVoyage
info.app.description=Passerelle principale de routage et de decouverte des microservices
info.app.version=1.0.0

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
