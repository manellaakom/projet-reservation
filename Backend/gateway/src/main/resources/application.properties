spring.application.name=gateway
server.port=8088

# Eureka integration for service discovery (used by lb:// service names)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Explicit gateway route config; discovery locator is kept off to avoid surprises
spring.cloud.gateway.discovery.locator.enabled=false

#Log routes
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Keycloak resource server. Create the realm/client with the Docker compose file.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skyvoyage}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/skyvoyage/protocol/openid-connect/certs}
