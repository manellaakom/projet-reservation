# Configuration de test : port 0 (RANDOM_PORT) pour eviter tout conflit de port avec Docker
server.port=0

# Desactivation des composants externes pendant les tests unitaires
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Configuration Securite pour l'environnement de test
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/skyvoyage
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/skyvoyage/protocol/openid-connect/certs
