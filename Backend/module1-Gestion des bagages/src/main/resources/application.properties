# ==========================================
# APPLICATION
# ==========================================
spring.application.name=gestion-bagages
server.port=8081

# ==========================================
# CONFIG SERVER
# ==========================================
spring.config.import=optional:configserver:http://localhost:8888

# ==========================================
# REDIS DATABASE
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==========================================
# RABBITMQ
# ==========================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ==========================================
# EUREKA DISCOVERY
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ==========================================
# KEYCLOAK - OAUTH2 RESOURCE SERVER
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/skyvoyage}

# ==========================================
# OPENFEIGN & RESILIENCE4J
# ==========================================
spring.cloud.openfeign.circuitbreaker.enabled=true

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==========================================
# ACTUATOR & PROMETHEUS
# ==========================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ==========================================
# APPLICATION INFORMATION
# ==========================================
info.app.name=Module 1 - Gestion des Bagages
info.app.description=Microservice de gestion et tarification des bagages avec Redis, RabbitMQ et Feign
info.app.version=1.0.0
