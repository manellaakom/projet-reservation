global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway:8080', 'host.docker.internal:8080']

  - job_name: 'gestion-bagages'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gestion-bagages:8081', 'host.docker.internal:8081']

  - job_name: 'discovery-eureka'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['discovery:8761', 'host.docker.internal:8761']

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8888', 'host.docker.internal:8888']
