services:
  # 1. Base de données NoSQL Redis
  redis:
    image: redis
    container_name: skyvoyage-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 2. Broker de messages asynchrone RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: skyvoyage-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 3. Serveur IAM Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: skyvoyage-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8180:8080"
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 4. Service Discovery Eureka
  discovery:
    build:
      context: ./Backend/discovery
      dockerfile: Dockerfile
    container_name: skyvoyage-discovery
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: discovery
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 5. Spring Cloud Config Server
  config-server:
    build:
      context: ./Backend/config-server
      dockerfile: Dockerfile
    container_name: skyvoyage-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_INSTANCE_HOSTNAME: config-server
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
    depends_on:
      - discovery
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 6. API Gateway Spring Cloud
  gateway:
    build:
      context: ./Backend/gateway
      dockerfile: Dockerfile
    container_name: skyvoyage-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_INSTANCE_HOSTNAME: gateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - discovery
      - config-server
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 7. Microservice Bagages (Module 1)
  gestion-bagages:
    build:
      context: ./Backend/module1-Gestion des bagages
      dockerfile: Dockerfile
    container_name: skyvoyage-gestion-bagages
    ports:
      - "8081:8081"
    environment:
      EUREKA_INSTANCE_HOSTNAME: gestion-bagages
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      - redis
      - rabbitmq
      - discovery
      - config-server
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 8. Monitoring Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: skyvoyage-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - skyvoyage-net

  # 9. Dashboard Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: skyvoyage-grafana
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - skyvoyage-net

networks:
  skyvoyage-net:
    driver: bridge
