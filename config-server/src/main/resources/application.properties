server.port=8888
spring.application.name=config-server

# Profil natif pour charger les configurations locales sans Git obligatoire
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config,file:./config-repo,file:../config-repo

# Configuration Eureka (Service Discovery)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Endpoints Actuator pour le monitoring et la vérification de santé
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always
