name: SkyVoyage CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "module-bagages", "recherche_consultation" ]
  pull_request:
    branches: [ "main", "master", "module-bagages", "recherche_consultation" ]

jobs:
  # ============================================================================
  # 1. Validation de la configuration Docker Compose
  # ============================================================================
  docker-compose-check:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Root and Backend Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f Backend/docker-compose.yml config --quiet

  # ============================================================================
  # 2. Build & Test Microservices Backend Java (Spring Boot)
  # ============================================================================
  backend-java-build:
    name: Build & Test Java Microservices (Modules 1, 2, 4 + Socle)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Discovery Server (Eureka)
        run: |
          cd Backend/discovery
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Config Server
        run: |
          cd Backend/config-server
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build API Gateway
        run: |
          cd Backend/gateway
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Test & Package Module 1 Gestion des Bagages
        run: |
          cd "Backend/module1-Gestion des bagages"
          chmod +x mvnw
          ./mvnw clean test package

      - name: Build Module 2 Recherche & Consultation
        run: |
          cd Backend/module2-recherche-consultation
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Build Module 4 Réservation & Paiement
        run: |
          cd Backend/module4-reservation-paiement
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  # ============================================================================
  # 3. Validation Module 3 (FastAPI Python)
  # ============================================================================
  backend-python-module3:
    name: Validate Module 3 (FastAPI Réservation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & validate syntax
        run: |
          cd Backend/module3-gestion-reservation
          pip install -r requirements.txt
          python -m compileall app/

      - name: Run module 3 tests
        run: |
          cd Backend/module3-gestion-reservation
          pip install -r requirements-dev.txt
          python -m pytest -q tests

  # ============================================================================
  # 4. Validation Module 5 (Symfony PHP)
  # ============================================================================
  backend-php-module5:
    name: Validate Module 5 (Symfony Support Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql

      - name: Validate composer configuration
        run: |
          cd Backend/module5-support-client
          composer validate --strict

  # ============================================================================
  # 5. Build Frontend Angular
  # ============================================================================
  frontend-build:
    name: Build Frontend Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd Frontend
          npm ci --legacy-peer-deps

      - name: Build Angular Application
        run: |
          cd Frontend
          npm run build
