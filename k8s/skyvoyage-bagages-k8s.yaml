apiVersion: v1
kind: Namespace
metadata:
  name: skyvoyage
---
# --- Redis Service & Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-bagages
  namespace: skyvoyage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-bagages
  template:
    metadata:
      labels:
        app: redis-bagages
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-bagages
  namespace: skyvoyage
spec:
  selector:
    app: redis-bagages
  ports:
    - port: 6379
      targetPort: 6379
---
# --- Eureka Discovery Service & Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: skyvoyage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      containers:
        - name: discovery
          image: skyvoyage/discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: skyvoyage
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
---
# --- Config Server Service & Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: skyvoyage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: skyvoyage/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: skyvoyage
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
---
# --- Microservice Bagages Service & Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-bagages
  namespace: skyvoyage
spec:
  replicas: 2 # Load balancing et tolérance aux pannes
  selector:
    matchLabels:
      app: gestion-bagages
  template:
    metadata:
      labels:
        app: gestion-bagages
    spec:
      containers:
        - name: gestion-bagages
          image: skyvoyage/gestion-bagages:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-bagages"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-bagages
  namespace: skyvoyage
spec:
  selector:
    app: gestion-bagages
  ports:
    - port: 8081
      targetPort: 8081
---
# --- API Gateway Service & Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skyvoyage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: skyvoyage/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skyvoyage
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
