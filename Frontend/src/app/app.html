<!-- 1. VUE EXTÉRIEURE : Page de Connexion Plein Écran (sans barre ni menu intérieur) -->
<div *ngIf="isLoginPage" class="external-layout">
  <router-outlet></router-outlet>
</div>

<!-- 2. VUE INTÉRIEURE : Application Complète (Accessible uniquement après connexion) -->
<div *ngIf="!isLoginPage" class="layout-wrapper">
  <!-- Topbar Sakai -->
  <header class="layout-topbar">
    <a routerLink="/" class="topbar-brand">
      <div class="brand-icon">
        <i class="pi pi-compass"></i>
      </div>
      <div>
        <span class="brand-name">SkyVoyage</span>
      </div>
    </a>

    <div class="topbar-actions">
      <div class="backend-pill">
        <span class="dot"></span>
        <span>Gateway : 8080</span>
      </div>

      <!-- Badge Utilisateur Global Connecté -->
      <div *ngIf="currentUser" class="topbar-user-badge" [class.admin-user]="currentUser.isAdmin">
        <i class="pi" [ngClass]="currentUser.isAdmin ? 'pi-star-fill' : 'pi-user'"></i>
        <span class="username">{{ currentUser.username }}</span>
        <span class="role-tag">{{ currentUser.isAdmin ? 'Admin' : 'Voyageur' }}</span>
        <button class="btn-logout" (click)="logout()" title="Se déconnecter et quitter l'application">
          <i class="pi pi-sign-out"></i>
          <span>Quitter</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Container avec Sidebar et Contenu Principal -->
  <div class="layout-container">
    <!-- Sidebar Sakai -->
    <aside class="layout-sidebar">
      <div>
        <div class="sidebar-section-title">Navigation Intérieure</div>
        <ul class="sidebar-menu">
          <li>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
              <i class="pi pi-home"></i>
              <span>Tableau de Bord</span>
            </a>
          </li>
          <li>
            <a routerLink="/voyages" routerLinkActive="active" class="menu-item">
              <i class="pi pi-compass"></i>
              <span>Rechercher un Voyage</span>
            </a>
          </li>
          <li>
            <a routerLink="/bagages" routerLinkActive="active" class="menu-item">
              <i class="pi pi-briefcase"></i>
              <span>Gestion des Bagages</span>
            </a>
          </li>
        </ul>
      </div>

      <!-- Carte d'information & Déconnexion au bas du menu -->
      <div class="sidebar-info-card">
        <h4>SkyVoyage Airlines</h4>
        <p>Session active en tant que <strong>{{ currentUser?.username || 'Utilisateur' }}</strong>.</p>
        <button class="btn-sidebar-logout" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          <span>Déconnexion</span>
        </button>
      </div>
    </aside>

    <!-- Contenu Principal -->
    <main class="layout-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
